name: Refresh catalogue metadata

# Star counts, licences and last-push dates drift. This rebuilds data/tools.js
# from the GitHub API once a month and commits only if something actually moved.

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the first of every month
  workflow_dispatch: {} # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the catalogue from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_data.py

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          if git diff --quiet -- data/tools.js; then
            echo "No change in data/tools.js — nothing to commit."
            exit 0
          fi
          git config user.name  "toolscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tools.js
          git commit -m "data: refresh repository metadata ($(date -u +%Y-%m-%d))"
          git push
