<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolscout — find developer tools by the job, not the name</title>
<meta name="description" content="117 developer tools across 17 jobs. Ordered by what you are trying to do, with maintenance signals read from GitHub.">
<meta name="theme-color" content="#161616">
<link rel="canonical" href="https://apsideslabs.github.io/toolscout/">
<link rel="preload" href="fonts/ibm-plex-sans-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="assets/mark.svg">
</head>
<body>

<a class="skip-link" href="#index">Skip to the index</a>

<header class="topbar" role="banner">
  <div class="shell topbar__row">
  <a class="topbar__name" href="index.html">
    <span class="topbar__prefix">Tool</span>scout
  </a>
  <nav class="topbar__nav" aria-label="Sections">
    <ul class="topbar__menu">
      <li><a class="topbar__link" href="#index">Index</a></li>
      <li><a class="topbar__link" href="method.html">Method</a></li>
      <li><a class="topbar__link" href="https://github.com/apsideslabs/toolscout" rel="noopener">Source</a></li>
    </ul>
  </nav>
  <p class="topbar__meta" id="mastheadNote"></p>
  </div>
</header>

<main>
  <section class="hero">
    <div class="shell hero__grid">
      <div class="hero__main">
        <h1 class="hero__title">Start with the job.<br><span>The tool is the easy part.</span></h1>

        <form class="searchrow" id="need" role="search" autocomplete="off">
          <div class="search">
            <label class="sr" for="q">Describe what you need</label>
            <svg class="search__icon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M29 27.586l-7.552-7.552a11.018 11.018 0 10-1.414 1.414L27.586 29zM4 13a9 9 0 119 9 9.01 9.01 0 01-9-9z"/>
            </svg>
            <input class="search__input" id="q" name="q" type="search" spellcheck="false"
                   placeholder="send transactional email without a monthly minimum">
          </div>
          <button class="btn btn--primary searchrow__go" type="submit">Find</button>
        </form>

        <div class="filters" id="facets" role="group" aria-label="Constraints"></div>
      </div>

      <aside class="matrix-wrap" aria-label="Every tool in the catalogue">
        <div class="matrix" id="matrix"></div>
        <p class="matrix__caption" id="matrixCaption">One square per tool, coloured by job</p>
      </aside>
    </div>
  </section>

  <section class="index" id="index">
    <div class="shell">
      <div class="section-head" id="indexHead">
        <div>
          <p class="label">Browse</p>
          <h2 class="section-title" id="browseTitle">Seventeen jobs</h2>
        </div>
        <p class="section-meta" id="indexMeta"></p>
      </div>

      <div class="jobs" id="jobs"></div>

      <div class="results" id="results" hidden>
        <div class="results__bar">
          <p class="results__count" id="resultCount" aria-live="polite"></p>
          <div class="results__controls">
            <label class="sr" for="sort">Sort results</label>
            <div class="select select--inline">
              <select class="select__input" id="sort">
                <option class="select__option" value="relevance">Most relevant</option>
                <option class="select__option" value="health">Recently updated</option>
                <option class="select__option" value="stars">Most starred</option>
                <option class="select__option" value="name">A–Z</option>
              </select>
            </div>
            <button class="btn btn--sm btn--tertiary" id="share" type="button">Copy link</button>
            <button class="btn btn--sm btn--ghost" id="clear" type="button">Clear</button>
          </div>
        </div>
        <ol class="tools" id="tools"></ol>
        <div id="empty" hidden>
          <p class="empty">Nothing matches. Try:</p>
          <div class="suggest-row" id="suggestRow"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="shell foot__row">
    <span id="footData"></span>
    <span><a class="link" href="method.html">Method</a> · <a class="link" href="https://github.com/apsideslabs/toolscout">Source</a> · MIT</span>
  </div>
</footer>

<noscript>
  <div class="shell" style="padding:1.5rem 0">
    <p class="empty">Filtering needs JavaScript. Every tool has a page under <code>tools/</code>.</p>
  </div>
</noscript>
<script src="data/tools.js"></script>
<script src="app.js"></script>
</body>
</html>
